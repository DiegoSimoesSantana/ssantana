<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" filter="url(#glow)"/>
  
  <!-- Inner Border Highlight -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="14.5" fill="none" stroke="white" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Monogram "SS" Tech Stylized -->
  <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- First 'S' -->
    <path d="M 28 20 C 22 20 20 23 20 27 C 20 32 30 33 30 38 C 30 42 27 44 21 44" />
    <!-- Second 'S' Intertwined / Parallel -->
    <path d="M 43 20 C 37 20 35 23 35 27 C 35 32 45 33 45 38 C 45 42 42 44 36 44" stroke="url(#accentGrad)" />
  </g>

  <!-- AI Pulse Dot -->
  <circle cx="48" cy="18" r="3" fill="#38bdf8" filter="url(#glow)"/>
</svg>
